<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cek Biaya Perjalanan</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        :root {
            --primary: #00AA13;
            --secondary: #00897b;
            --danger: #e53935;
            --light: #f5f5f5;
            --dark: #333;
            --shadow: 0 2px 10px rgba(0,0,0,0.15);
        }

        body {
            background: #fff;
            color: var(--dark);
            overflow-x: hidden;
        }

        /* Layout Utama */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* Peta */
        #map {
            flex: 1;
            z-index: 1;
        }

        /* Panel Atas */
        .top-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 1000;
            background: white;
            border-radius: 12px;
            padding: 12px;
            box-shadow: var(--shadow);
        }

        .location-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .location-row:last-child { margin-bottom: 0; }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot.start { background: var(--primary); }
        .dot.end { background: var(--danger); }
        .dot.waypoint { background: #ff9800; }

        .location-input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .location-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,170,19,0.1);
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: var(--light);
            color: var(--dark);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-icon:hover { background: #e0e0e0; }
        .btn-icon.gps { color: var(--primary); }

        /* Tombol Tambah Titik */
        .add-waypoint {
            background: none;
            border: 1px dashed var(--primary);
            color: var(--primary);
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .add-waypoint:hover {
            background: rgba(0,170,19,0.05);
        }

        /* Panel Bawah */
        .bottom-panel {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            z-index: 1000;
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .tarif-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .tarif-input {
            width: 100px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: right;
            font-size: 14px;
            outline: none;
        }
        .tarif-input:focus { border-color: var(--primary); }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 15px;
            border-bottom: 1px solid #eee;
        }
        .info-row:last-child { border-bottom: none; }
        .info-row.total {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 4px;
        }

        .btn-hitung {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-hitung:hover { background: #008a10; }
        .btn-hitung:disabled { background: #99e29f; cursor: not-allowed; }

        /* Instruksi Edit Peta */
        .edit-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 999;
            display: none;
            text-align: center;
        }

        /* Leaflet Routing Custom */
        .leaflet-routing-container { display: none !important; }
        .leaflet-control-attribution { font-size: 10px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="map"></div>

        <div class="edit-hint" id="editHint">Klik pada peta untuk memindahkan titik</div>

        <!-- Panel Atas -->
        <div class="top-panel">
            <div class="location-row">
                <span class="dot start"></span>
                <input type="text" class="location-input" id="startInput" placeholder="Lokasi Awal">
                <button class="btn-icon gps" id="gpsStart" title="Gunakan Lokasi Saya">📍</button>
            </div>

            <div id="waypointContainer"></div>

            <div class="location-row">
                <span class="dot end"></span>
                <input type="text" class="location-input" id="endInput" placeholder="Tujuan Akhir">
                <button class="btn-icon gps" id="gpsEnd" title="Gunakan Lokasi Saya">📍</button>
            </div>

            <button class="add-waypoint" id="addWaypoint">+ Tambah Titik Perantara</button>
        </div>

        <!-- Panel Bawah -->
        <div class="bottom-panel">
            <div class="tarif-row">
                <span>Tarif Dasar per Km:</span>
                <div>
                    <span>Rp </span>
                    <input type="number" class="tarif-input" id="tarifPerKm" value="4000" min="100" step="100">
                </div>
            </div>

            <div class="info-row">
                <span>Jarak:</span>
                <span id="jarak">0 km</span>
            </div>
            <div class="info-row">
                <span>Estimasi Biaya:</span>
                <span id="biaya">Rp 0</span>
            </div>
            <div class="info-row total">
                <span>Total:</span>
                <span id="total">Rp 0</span>
            </div>

            <button class="btn-hitung" id="btnHitung">Hitung Biaya</button>
        </div>
    </div>

    <script>
        // Inisialisasi Variabel
        let map, routingControl;
        let titikAwal = null, titikAkhir = null;
        let titikPerantara = [];
        let editMode = null;
        const tarifDefault = 4000;

        // Inisialisasi Peta
        function initMap() {
            // Peta berpusat di Indonesia
            map = L.map('map').setView([-6.200000, 106.816666], 13);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // Event klik peta untuk edit titik
            map.on('click', (e) => {
                if (editMode) {
                    setTitik(editMode, e.latlng);
                    editMode = null;
                    document.getElementById('editHint').style.display = 'none';
                }
            });

            // Coba ambil lokasi GPS saat buka
            ambilLokasiGPS('start');
        }

        // Ambil Lokasi GPS
        function ambilLokasiGPS(tipe) {
            if (!navigator.geolocation) {
                alert("Perangkat tidak mendukung fitur Lokasi");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
                    setTitik(tipe, latlng);
                    map.setView(latlng, 15);
                },
                (err) => {
                    console.warn("Gagal ambil lokasi:", err.message);
                    alert("Izinkan akses lokasi atau masukkan alamat secara manual");
                },
                { enableHighAccuracy: true }
            );
        }

        // Atur Titik Lokasi
        function setTitik(tipe, latlng) {
            const nama = `Lokasi (${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)})`;
            
            switch(tipe) {
                case 'start':
                    titikAwal = latlng;
                    document.getElementById('startInput').value = nama;
                    break;
                case 'end':
                    titikAkhir = latlng;
                    document.getElementById('endInput').value = nama;
                    break;
                default:
                    const idx = parseInt(tipe.split('-')[1]);
                    titikPerantara[idx] = latlng;
                    document.getElementById(`waypoint-${idx}`).value = nama;
            }
            hitungRute();
        }

        // Tambah Titik Perantara
        document.getElementById('addWaypoint').addEventListener('click', () => {
            const container = document.getElementById('waypointContainer');
            const idx = titikPerantara.length;
            titikPerantara.push(null);

            const baris = document.createElement('div');
            baris.className = 'location-row';
            baris.innerHTML = `
                <span class="dot waypoint"></span>
                <input type="text" class="location-input" id="waypoint-${idx}" placeholder="Titik Perantara ${idx+1}" readonly>
                <button class="btn-icon gps" onclick="mulaiEdit('waypoint-${idx}')" title="Tandai di Peta">📍</button>
                <button class="btn-icon" onclick="hapusWaypoint(${idx})" title="Hapus">×</button>
            `;
            container.appendChild(baris);
        });

        function hapusWaypoint(idx) {
            titikPerantara[idx] = null;
            document.getElementById(`waypoint-${idx}`).parentElement.remove();
            hitungRute();
        }

        // Mode Edit Titik di Peta
        function mulaiEdit(tipe) {
            editMode = tipe;
            document.getElementById('editHint').style.display = 'block';
        }

        // Hitung Rute & Biaya
        function hitungRute() {
            if (!titikAwal || !titikAkhir) return;

            // Hapus rute lama
            if (routingControl) map.removeControl(routingControl);

            // Susun semua titik rute
            const waypoints = [titikAwal];
            titikPerantara.forEach(t => { if (t) waypoints.push(t); });
            waypoints.push(titikAkhir);

            // Buat Routing
            routingControl = L.Routing.control({
                waypoints: waypoints,
                router: L.Routing.osrmv1({ profile: 'driving' }),
                lineOptions: {
                    styles: [{ color: '#00AA13', opacity: 0.7, weight: 5 }]
                },
                showAlternatives: false,
                addWaypoints: false,
                draggableWaypoints: false,
                fitSelectedRoutes: true
            }).addTo(map);

            // Hasil Perhitungan
            routingControl.on('routesfound', (e) => {
                const rute = e.routes[0];
                const jarakKm = (rute.summary.totalDistance / 1000).toFixed(1);
                const tarif = parseInt(document.getElementById('tarifPerKm').value) || tarifDefault;
                let biaya = Math.ceil(jarakKm * tarif);

                // Format Rupiah
                const formatRupiah = (angka) => 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");

                document.getElementById('jarak').textContent = `${jarakKm} km`;
                document.getElementById('biaya').textContent = formatRupiah(biaya);
                document.getElementById('total').textContent = formatRupiah(biaya);
            });
        }

        // Event Listener
        document.getElementById('gpsStart').addEventListener('click', () => ambilLokasiGPS('start'));
        document.getElementById('gpsEnd').addEventListener('click', () => ambilLokasiGPS('end'));
        document.getElementById('startInput').addEventListener('click', () => mulaiEdit('start'));
        document.getElementById('endInput').addEventListener('click', () => mulaiEdit('end'));
        document.getElementById('btnHitung').addEventListener('click', hitungRute);

        // Inisialisasi Awal
        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>

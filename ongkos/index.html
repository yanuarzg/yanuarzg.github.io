<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cek Biaya Jarak</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --primary: #00aa5b;
      --primary-dark: #008c4a;
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface-2: #252525;
      --text: #ffffff;
      --text-secondary: #b0b0b0;
      --border: #333;
      --danger: #ff4d4f;
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Map */
    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
    }

    /* Top bar */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 12px 12px 0;
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }

    .search-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .point-row {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .point-row:last-child { border-bottom: none; }

    .point-icon {
      width: 18px; height: 18px;
      flex-shrink: 0;
    }
    .point-icon.start { color: var(--primary); }
    .point-icon.end { color: #ff6b6b; }
    .point-icon.via { color: #f0ad4e; }

    .point-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      outline: none;
      padding: 4px 0;
    }
    .point-input::placeholder { color: var(--text-secondary); }

    .btn-icon {
      width: 36px; height: 36px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-icon:active { background: var(--surface-2); }
    .btn-icon svg { width: 20px; height: 20px; }

    .suggestions {
      position: absolute;
      left: 40px; right: 12px;
      top: 100%;
      background: var(--surface);
      border-radius: 0 0 12px 12px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 20;
      box-shadow: var(--shadow);
      display: none;
    }
    .suggestions.show { display: block; }
    .suggestion-item {
      padding: 12px 14px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .suggestion-item:active { background: var(--surface-2); }
    .suggestion-item:last-child { border-bottom: none; }

    /* Floating buttons */
    .fab-group {
      position: absolute;
      right: 14px;
      bottom: 280px;
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fab {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--surface);
      border: none;
      color: var(--text);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .fab:active { transform: scale(0.94); }
    .fab svg { width: 22px; height: 22px; }
    .fab.primary { background: var(--primary); color: #fff; }

    /* Bottom sheet */
    .bottom-sheet {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 1000;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
      padding: 8px 16px 24px;
      max-height: 42vh;
      overflow-y: auto;
    }
    .handle {
      width: 40px; height: 4px;
      background: #555;
      border-radius: 2px;
      margin: 0 auto 14px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .result-label { font-size: 13px; color: var(--text-secondary); }
    .result-value { font-size: 22px; font-weight: 700; }
    .result-value.price { color: var(--primary); }

    .price-setting {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-2);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }
    .price-setting label { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
    .price-setting input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      outline: none;
      text-align: right;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:active { background: var(--primary-dark); }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }
    .btn-outline:active { background: var(--surface-2); }
    .btn svg { width: 18px; height: 18px; }

    .waypoint-list {
      margin-bottom: 12px;
    }
    .waypoint-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 70px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #333;
      color: #fff;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Loading overlay */
    .loading {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1500;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .loading.show { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #555;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Marker custom */
    .leaflet-div-icon {
      background: transparent;
      border: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Top search card -->
  <div class="top-bar">
    <div class="search-card" id="searchCard">
      <!-- Start -->
      <div class="point-row" data-type="start">
        <svg class="point-icon start" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="8"/>
        </svg>
        <input class="point-input" id="inputStart" placeholder="Titik awal" autocomplete="off" />
        <button class="btn-icon" id="btnMyLoc" title="Lokasi saya">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
          </svg>
        </button>
        <div class="suggestions" id="sugStart"></div>
      </div>

      <!-- Waypoints container -->
      <div id="waypointsContainer"></div>

      <!-- End -->
      <div class="point-row" data-type="end">
        <svg class="point-icon end" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/>
        </svg>
        <input class="point-input" id="inputEnd" placeholder="Tujuan" autocomplete="off" />
        <button class="btn-icon" id="btnAddVia" title="Tambah titik">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <div class="suggestions" id="sugEnd"></div>
      </div>
    </div>
  </div>

  <!-- Floating action buttons -->
  <div class="fab-group">
    <button class="fab" id="btnLocate" title="Lokasi saya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
      </svg>
    </button>
    <button class="fab primary" id="btnCalc" title="Hitung">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </div>

  <!-- Bottom sheet -->
  <div class="bottom-sheet">
    <div class="handle"></div>

    <div class="result-row">
      <div>
        <div class="result-label">Jarak</div>
        <div class="result-value" id="distanceText">– km</div>
      </div>
      <div style="text-align:right">
        <div class="result-label">Estimasi Biaya</div>
        <div class="result-value price" id="priceText">Rp –</div>
      </div>
    </div>

    <div class="price-setting">
      <label>Harga / km</label>
      <input type="number" id="pricePerKm" value="4000" min="0" step="500" />
      <span style="font-size:13px;color:var(--text-secondary)">Rp</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-outline" id="btnClear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
        </svg>
        Reset
      </button>
      <button class="btn btn-primary" id="btnRecalc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
        Hitung Ulang
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="loading" id="loading"><div class="spinner"></div></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ========== STATE ==========
    let map, routeLayer;
    let points = {
      start: null,   // {lat, lng, name}
      end: null,
      vias: []       // array of {lat, lng, name}
    };
    let markers = { start: null, end: null, vias: [] };
    let pricePerKm = 4000;
    let debounceTimers = {};

    // ========== INIT MAP ==========
    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([-6.2088, 106.8456], 13); // Jakarta default

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);

      // Click on map to set missing point
      map.on('click', (e) => {
        if (!points.start) {
          setPoint('start', e.latlng.lat, e.latlng.lng);
        } else if (!points.end) {
          setPoint('end', e.latlng.lat, e.latlng.lng);
        } else {
          // add via
          addVia(e.latlng.lat, e.latlng.lng);
        }
      });
    }

    // ========== MARKERS ==========
    function createMarkerIcon(type) {
      const colors = { start: '#00aa5b', end: '#ff6b6b', via: '#f0ad4e' };
      const color = colors[type] || '#888';
      return L.divIcon({
        className: 'custom-marker',
        html: `<div style="
          width:28px;height:28px;border-radius:50% 50% 50% 0;
          background:${color};border:3px solid #fff;
          transform:rotate(-45deg);box-shadow:0 2px 8px rgba(0,0,0,0.4);
          display:flex;align-items:center;justify-content:center;
        "><div style="width:8px;height:8px;background:#fff;border-radius:50%;transform:rotate(45deg)"></div></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 28]
      });
    }

    function setPoint(type, lat, lng, name = null) {
      points[type] = { lat, lng, name: name || `${lat.toFixed(5)}, ${lng.toFixed(5)}` };

      if (markers[type]) map.removeLayer(markers[type]);

      markers[type] = L.marker([lat, lng], {
        icon: createMarkerIcon(type),
        draggable: true
      }).addTo(map);

      markers[type].on('dragend', (e) => {
        const pos = e.target.getLatLng();
        points[type].lat = pos.lat;
        points[type].lng = pos.lng;
        reverseGeocode(pos.lat, pos.lng).then(n => {
          points[type].name = n;
          updateInput(type);
        });
        calculateRoute();
      });

      updateInput(type);
      if (!name) {
        reverseGeocode(lat, lng).then(n => {
          points[type].name = n;
          updateInput(type);
        });
      }

      fitBounds();
      if (points.start && points.end) calculateRoute();
    }

    function addVia(lat, lng, name = null) {
      const via = { lat, lng, name: name || `${lat.toFixed(5)}, ${lng.toFixed(5)}` };
      points.vias.push(via);

      const marker = L.marker([lat, lng], {
        icon: createMarkerIcon('via'),
        draggable: true
      }).addTo(map);

      const idx = points.vias.length - 1;
      marker.on('dragend', (e) => {
        const pos = e.target.getLatLng();
        points.vias[idx].lat = pos.lat;
        points.vias[idx].lng = pos.lng;
        reverseGeocode(pos.lat, pos.lng).then(n => {
          points.vias[idx].name = n;
          renderWaypointsUI();
        });
        calculateRoute();
      });

      markers.vias.push(marker);
      renderWaypointsUI();

      if (!name) {
        reverseGeocode(lat, lng).then(n => {
          points.vias[idx].name = n;
          renderWaypointsUI();
        });
      }

      fitBounds();
      if (points.start && points.end) calculateRoute();
    }

    function removeVia(index) {
      if (markers.vias[index]) map.removeLayer(markers.vias[index]);
      markers.vias.splice(index, 1);
      points.vias.splice(index, 1);
      renderWaypointsUI();
      calculateRoute();
    }

    function updateInput(type) {
      const el = document.getElementById(type === 'start' ? 'inputStart' : 'inputEnd');
      if (el && points[type]) el.value = points[type].name;
    }

    function renderWaypointsUI() {
      const container = document.getElementById('waypointsContainer');
      container.innerHTML = '';
      points.vias.forEach((v, i) => {
        const row = document.createElement('div');
        row.className = 'point-row';
        row.innerHTML = `
          <svg class="point-icon via" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="6"/>
          </svg>
          <input class="point-input" value="${v.name}" readonly />
          <button class="btn-icon" data-idx="${i}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        `;
        row.querySelector('button').onclick = () => removeVia(i);
        container.appendChild(row);
      });
    }

    function fitBounds() {
      const coords = [];
      if (points.start) coords.push([points.start.lat, points.start.lng]);
      points.vias.forEach(v => coords.push([v.lat, v.lng]));
      if (points.end) coords.push([points.end.lat, points.end.lng]);
      if (coords.length >= 2) {
        map.fitBounds(coords, { padding: [80, 80, 280, 80] });
      } else if (coords.length === 1) {
        map.setView(coords[0], 15);
      }
    }

    // ========== GEOCODING ==========
    async function reverseGeocode(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=\( {lat}&lon= \){lng}&format=json&addressdetails=1`, {
          headers: { 'Accept-Language': 'id' }
        });
        const data = await res.json();
        if (data.display_name) {
          // simplify
          const parts = data.display_name.split(',').slice(0, 3);
          return parts.join(',').trim();
        }
      } catch (e) {}
      return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }

    async function searchAddress(query, type) {
      if (!query || query.length < 3) return [];
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&addressdetails=1&limit=5&countrycodes=id`, {
          headers: { 'Accept-Language': 'id' }
        });
        return await res.json();
      } catch (e) {
        return [];
      }
    }

    function showSuggestions(items, type) {
      const box = document.getElementById(type === 'start' ? 'sugStart' : 'sugEnd');
      if (!items.length) {
        box.classList.remove('show');
        return;
      }
      box.innerHTML = items.map(item => `
        <div class="suggestion-item" data-lat="\( {item.lat}" data-lng=" \){item.lon}" data-name="${item.display_name.split(',').slice(0,3).join(',').trim()}">
          ${item.display_name.split(',').slice(0,3).join(',').trim()}
        </div>
      `).join('');
      box.classList.add('show');

      box.querySelectorAll('.suggestion-item').forEach(el => {
        el.onclick = () => {
          const lat = parseFloat(el.dataset.lat);
          const lng = parseFloat(el.dataset.lng);
          const name = el.dataset.name;
          setPoint(type, lat, lng, name);
          box.classList.remove('show');
        };
      });
    }

    // ========== ROUTING (OSRM) ==========
    async function calculateRoute() {
      if (!points.start || !points.end) return;

      showLoading(true);
      try {
        const coords = [
          `\( {points.start.lng}, \){points.start.lat}`,
          ...points.vias.map(v => `\( {v.lng}, \){v.lat}`),
          `\( {points.end.lng}, \){points.end.lat}`
        ].join(';');

        const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.code !== 'Ok' || !data.routes.length) {
          toast('Rute tidak ditemukan');
          showLoading(false);
          return;
        }

        const route = data.routes[0];
        const distanceKm = route.distance / 1000;
        const cost = Math.round(distanceKm * pricePerKm);

        // Draw route
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.geoJSON(route.geometry, {
          style: { color: '#00aa5b', weight: 5, opacity: 0.85 }
        }).addTo(map);

        document.getElementById('distanceText').textContent = distanceKm.toFixed(1) + ' km';
        document.getElementById('priceText').textContent = 'Rp ' + cost.toLocaleString('id-ID');

        fitBounds();
      } catch (e) {
        console.error(e);
        toast('Gagal menghitung rute');
      }
      showLoading(false);
    }

    // ========== GPS ==========
    function getMyLocation(setAsStart = true) {
      if (!navigator.geolocation) {
        toast('GPS tidak didukung');
        return;
      }
      showLoading(true);
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          if (setAsStart) {
            setPoint('start', latitude, longitude);
            map.setView([latitude, longitude], 15);
          } else {
            map.setView([latitude, longitude], 15);
          }
          showLoading(false);
          toast('Lokasi ditemukan');
        },
        (err) => {
          showLoading(false);
          toast('Gagal mendapatkan lokasi');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // ========== UI HELPERS ==========
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('show', show);
    }

    function clearAll() {
      if (markers.start) map.removeLayer(markers.start);
      if (markers.end) map.removeLayer(markers.end);
      markers.vias.forEach(m => map.removeLayer(m));
      if (routeLayer) map.removeLayer(routeLayer);

      points = { start: null, end: null, vias: [] };
      markers = { start: null, end: null, vias: [] };
      routeLayer = null;

      document.getElementById('inputStart').value = '';
      document.getElementById('inputEnd').value = '';
      document.getElementById('distanceText').textContent = '– km';
      document.getElementById('priceText').textContent = 'Rp –';
      document.getElementById('waypointsContainer').innerHTML = '';
    }

    // ========== EVENTS ==========
    document.getElementById('btnMyLoc').onclick = () => getMyLocation(true);
    document.getElementById('btnLocate').onclick = () => getMyLocation(false);
    document.getElementById('btnCalc').onclick = calculateRoute;
    document.getElementById('btnRecalc').onclick = calculateRoute;
    document.getElementById('btnClear').onclick = clearAll;

    document.getElementById('btnAddVia').onclick = () => {
      if (!points.start || !points.end) {
        toast('Isi titik awal & tujuan dulu');
        return;
      }
      // place via in the middle of map
      const center = map.getCenter();
      addVia(center.lat, center.lng);
      toast('Titik perantara ditambahkan – geser marker untuk atur');
    };

    document.getElementById('pricePerKm').oninput = (e) => {
      pricePerKm = parseFloat(e.target.value) || 0;
      if (points.start && points.end) calculateRoute();
    };

    // Autocomplete
    ['Start', 'End'].forEach(type => {
      const input = document.getElementById('input' + type);
      const key = type.toLowerCase();
      input.addEventListener('input', () => {
        clearTimeout(debounceTimers[key]);
        debounceTimers[key] = setTimeout(async () => {
          const items = await searchAddress(input.value, key);
          showSuggestions(items, key);
        }, 400);
      });
      input.addEventListener('focus', () => {
        if (input.value.length >= 3) {
          searchAddress(input.value, key).then(items => showSuggestions(items, key));
        }
      });
    });

    // Close suggestions when click outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.point-row')) {
        document.getElementById('sugStart').classList.remove('show');
        document.getElementById('sugEnd').classList.remove('show');
      }
    });

    // ========== START ==========
    initMap();
    // Coba ambil lokasi otomatis saat buka
    setTimeout(() => getMyLocation(true), 800);
  </script>
</body>
</html>
